<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualWEB</title>
</head>
<body>
    <h2>Напишешь код HTML снизу - получишь визуализацию твоего сайта прямо здесь!</h2>

    <textarea id="code" rows="12" cols="70" style="font-family: monospace; font-size: 14px; width: 100%; max-width: 700px;">
Код писать тут!
    </textarea>

    <hr>

    <div id="preview" style="border: 1px solid #ccc; padding: 10px; min-height: 100px;">
    </div>

    <script>
        const code = document.getElementById('code');
        const preview = document.getElementById('preview');

        function update() {
            preview.innerHTML = code.value;
        }

        code.addEventListener('input', update);
        update();
    </script>
    <p align="center">
    <b>&copy; 2026 DeepSeek</b>
</p>
</body>
</html>
